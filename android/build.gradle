// NOTE: this build.gradle is applied as an autolinked subproject of the
// consumer app. The consumer's root build.gradle is responsible for the
// `classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:..."` dependency
// and for declaring repositories. Declaring our own `buildscript { ... }`
// block here causes AGP 8.x to load the kotlin-gradle-plugin in an isolated
// classloader; the `kotlin-android` plugin then silently fails to apply,
// leaving every Kotlin stdlib reference (`emptyList`, `let`, `it`, ...)
// unresolved at compileDebugKotlin time.

apply plugin: "com.android.library"
apply plugin: "kotlin-android"


def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RollaWrapper_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "app.rolla.reactnative"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    consumerProguardFiles "consumer-rules.pro"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

// Repositories come from the consumer's settings.gradle under
// `dependencyResolutionManagement`; declaring them here trips PREFER_SETTINGS.

dependencies {
  implementation "com.facebook.react:react-android"
  // kotlin-stdlib is auto-applied by the kotlin-android plugin in Kotlin 1.8+
  // / AGP 8+. Declaring it explicitly with an interpolated $kotlin_version
  // breaks under some Gradle configurations (the property lookup returns empty,
  // producing a malformed dep coordinate that silently resolves to nothing
  // and leaves Kotlin's stdlib off the compile classpath — every stdlib
  // reference like `it`, `apply`, `emptyList` then fails to resolve).

  // Native Android distribution of the Rolla SDK. Exact pin — bump in lockstep
  // with the compatibility matrix in README.md. Gradle resolves this from the
  // Maven repository the consumer adds to their settings.gradle (see README).
  implementation "com.rolla.sdk:android_release:0.1.10"

  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
